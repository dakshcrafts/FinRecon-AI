<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – FinRecon AI</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            padding: 2.25rem 2rem;
            color: #ffffff;
            text-align: center;
        }
        .auth-body {
            padding: 2rem;
        }
        .btn-primary {
            background-color: #4f46e5;
            border-color: #4f46e5;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-20 mb-3">
                <i class="bi bi-person-plus-fill fs-2 text-white"></i>
            </div>
            <h3 class="fw-bold mb-1">Create Account</h3>
            <p class="mb-0 text-white-50 small">Join FinRecon AI Intelligence Workspace</p>
        </div>

        <div class="auth-body">
            {% if error %}
            <div class="alert alert-danger py-2 px-3 small d-flex align-items-center mb-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="/auth/register">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" name="full_name" class="form-control border-start-0 ps-0" placeholder="Jane Doe" value="{{ full_name or '' }}" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="jane@company.com" value="{{ email or '' }}" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="At least 6 characters" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3 shadow-sm">
                    <i class="bi bi-check2-circle me-2"></i> Create Account
                </button>
            </form>

            <div class="text-center mt-3 pt-2 border-top">
                <span class="text-muted small">Already have an account?</span>
                <a href="/auth/login" class="small fw-semibold text-primary text-decoration-none ms-1">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
